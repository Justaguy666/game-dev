<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="32" height="32" shape-rendering="crispEdges">
  <!-- Outer Dark Chassis Armor -->
  <rect x="2" y="2" width="12" height="12" fill="#060911" />
  
  <!-- Corner Armor Plates Glowing Cyan -->
  <rect x="2" y="2" width="3" height="1" fill="#00f0ff" />
  <rect x="2" y="2" width="1" height="3" fill="#00f0ff" />
  <rect x="11" y="2" width="3" height="1" fill="#00f0ff" />
  <rect x="13" y="2" width="1" height="3" fill="#00f0ff" />
  <rect x="2" y="13" width="3" height="1" fill="#00f0ff" />
  <rect x="2" y="11" width="1" height="3" fill="#00f0ff" />
  <rect x="11" y="13" width="3" height="1" fill="#00f0ff" />
  <rect x="13" y="11" width="1" height="3" fill="#00f0ff" />
  
  <!-- Inner Circuit Substrate -->
  <rect x="4" y="4" width="8" height="8" fill="#0d121f" />
  
  <!-- Energy Conduit Crosshair (Cyan Laser) -->
  <rect x="7" y="3" width="2" height="10" fill="#00f0ff" />
  <rect x="3" y="7" width="10" height="2" fill="#00f0ff" />
  
  <!-- Central Nuclear Plasma Core (Amber Glow & White Hot Center) -->
  <rect x="6" y="6" width="4" height="4" fill="#ffbe0b" />
  <rect x="7" y="7" width="2" height="2" fill="#ffffff" />
  
  <!-- Telemetry Pulse Diodes (Neon Rose) -->
  <rect x="5" y="5" width="1" height="1" fill="#ff0055" />
  <rect x="10" y="10" width="1" height="1" fill="#ff0055" />
</svg>