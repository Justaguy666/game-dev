<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="32" height="32" shape-rendering="crispEdges">
  <!-- Outer Dark Border -->
  <rect x="2" y="1" width="12" height="14" fill="#0d1117" />
  
  <!-- Cartridge Body (Aseprite Retro Palette) -->
  <rect x="3" y="2" width="10" height="12" fill="#f59e0b" />
  <rect x="3" y="2" width="1" height="12" fill="#fde047" />
  <rect x="3" y="2" width="10" height="1" fill="#fde047" />
  <rect x="12" y="2" width="1" height="12" fill="#b45309" />
  
  <!-- Top grip indent -->
  <rect x="5" y="2" width="6" height="1" fill="#0d1117" />
  <rect x="6" y="3" width="4" height="1" fill="#b45309" />
  
  <!-- Screen/Label Inset -->
  <rect x="4" y="5" width="8" height="6" fill="#181825" />
  <rect x="4" y="5" width="8" height="1" fill="#11111b" />
  
  <!-- Glowing Pixel Gem Star -->
  <rect x="7" y="6" width="2" height="4" fill="#38bdf8" />
  <rect x="6" y="7" width="4" height="2" fill="#38bdf8" />
  <rect x="7" y="7" width="2" height="2" fill="#ffffff" />
  
  <!-- Retro Status Dots -->
  <rect x="5" y="12" width="2" height="1" fill="#ef4444" />
  <rect x="8" y="12" width="3" height="1" fill="#22c55e" />
</svg>
